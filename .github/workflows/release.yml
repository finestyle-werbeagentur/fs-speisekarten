# Neue Version veröffentlichen:
# 1. Version in fs-speisekarten.php (Kopf + FS_SK_VERSION) erhöhen und pushen
# 2. Auf GitHub ein Release anlegen: Tag „v1.6.1“ (gleiche Nummer), kurz beschreiben, „Publish release“
# → diese Aktion baut fs-speisekarten.zip und hängt sie an das Release.
#   Alle Seiten mit dem Plugin zeigen danach „Update verfügbar“ (auch in MainWP).
name: Release
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Version prüfen
        run: |
          TAG="${{ github.event.release.tag_name }}"; TAG="${TAG#v}"
          FILE=$(grep -oP "define\( 'FS_SK_VERSION', '\K[^']+" fs-speisekarten.php)
          HEAD=$(grep -oP "^ \* Version:\s+\K\S+" fs-speisekarten.php)
          echo "Tag $TAG · Konstante $FILE · Kopf $HEAD"
          [ "$TAG" = "$FILE" ] && [ "$TAG" = "$HEAD" ] || { echo "::error::Versionsnummern passen nicht zum Tag"; exit 1; }
      - name: ZIP bauen
        run: |
          mkdir -p build/fs-speisekarten
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'build' --exclude 'README.md' ./ build/fs-speisekarten/
          cd build && zip -qr ../fs-speisekarten.zip fs-speisekarten
      - name: ZIP an das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" fs-speisekarten.zip --clobber --repo "${{ github.repository }}"
