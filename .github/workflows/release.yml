# Neue Version veröffentlichen:
# Versionsnummer in fs-speisekarten.php erhöhen (Kopf „Version:“ und FS_SK_VERSION) und nach „main“ pushen.
# → Zuerst „Kartentest“: Alle Karten aller Websites aus tests/sites.txt werden mit der neuen und
#   der letzten veröffentlichten Version ausgelesen und verglichen.
#   Kein Unterschied → Release wird angelegt.
#   Unterschied → kein Release; die Unterschiede stehen in der Zusammenfassung des Laufs.
#   Sind sie gewollt und geprüft: „[karten-ok]“ in die Commit-Nachricht schreiben (oder den Lauf
#   per „Run workflow“ mit „Änderungen geprüft“ starten).
# Gleiche Nummer wie ein bestehendes Release → es passiert nichts.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ok:
        description: 'Änderungen an Karten geprüft und gewollt'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: v
        run: |
          FILE=$(grep -oP "define\( 'FS_SK_VERSION', '\K[^']+" fs-speisekarten.php)
          HEAD=$(grep -oP "^ \* Version:\s+\K\S+" fs-speisekarten.php)
          echo "Konstante $FILE · Kopf $HEAD"
          [ "$FILE" = "$HEAD" ] || { echo "::error::Versionsnummern in fs-speisekarten.php passen nicht zusammen"; exit 1; }
          echo "version=$FILE" >> "$GITHUB_OUTPUT"
          if gh release view "v$FILE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=no" >> "$GITHUB_OUTPUT"; else echo "new=yes" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

  kartentest:
    needs: version
    if: needs.version.outputs.new == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Letzte veröffentlichte Version holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          echo "Vergleich mit $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git worktree add /tmp/alt "$TAG"
      - name: Karten auslesen (alt und neu)
        run: |
          mkdir -p /tmp/pdfjs && cd /tmp/pdfjs && npm init -y >/dev/null && npm i --silent pdfjs-dist@4.10.38
          export PDFJS=/tmp/pdfjs/node_modules/pdfjs-dist/legacy/build/pdf.mjs
          cd "$GITHUB_WORKSPACE"
          node tests/karten.mjs /tmp/alt /tmp/out/alt
          node tests/karten.mjs . /tmp/out/neu
      - name: Vergleichen
        env:
          OK: ${{ contains(github.event.head_commit.message, '[karten-ok]') || inputs.ok }}
        run: |
          if diff -ru /tmp/out/alt /tmp/out/neu > /tmp/diff.txt; then
            echo "### ✅ Kartentest: alle Karten unverändert (Vergleich mit $TAG)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          { echo "### ⚠️ Kartentest: Änderungen gegenüber $TAG"; echo '```diff'; head -c 60000 /tmp/diff.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/diff.txt
          if [ "$OK" = "true" ]; then echo "Änderungen als geprüft markiert – Release geht raus."; exit 0; fi
          echo "::error::Karten ändern sich – bitte Unterschiede prüfen. Wenn gewollt: Commit mit [karten-ok] oder Lauf mit „Änderungen geprüft“ starten."
          exit 1

  release:
    needs: [version, kartentest]
    if: needs.version.outputs.new == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP bauen
        run: |
          mkdir -p build/fs-speisekarten
          rsync -a --exclude '.git*' --exclude '.github' --exclude 'build' --exclude 'tests' --exclude 'README.md' --exclude 'CHANGELOG.md' ./ build/fs-speisekarten/
          cd build && zip -qr ../fs-speisekarten.zip fs-speisekarten
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ needs.version.outputs.version }}"
          NOTES=$(awk -v v="## $V" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md 2>/dev/null)
          [ -n "$NOTES" ] || NOTES="Version $V"
          gh release create "v$V" fs-speisekarten.zip --target "$GITHUB_SHA" --title "Version $V" --notes "$NOTES"
